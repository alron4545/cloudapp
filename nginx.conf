server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: send unknown routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints everything in /assets, so it can be cached forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Simple endpoint for cloud load balancer / container health checks
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
