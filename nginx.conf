# The path the visitor asked for, without the query string. ($uri can't be
# used: the SPA fallback rewrites it to /index.html.)
map $request_uri $request_path {
    ~^(?<p>[^?]*) $p;
}

# One JSON object per request, so Loki can parse fields with `| json`.
log_format json_logs escape=json
    '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"path":"$request_path",'
        '"query":"$args",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent"'
    '}';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects keep whatever host:port the visitor used (e.g. :8080).
    absolute_redirect off;

    # The nginx image links this file to the container's stdout, where
    # Grafana Alloy picks it up.
    access_log /var/log/nginx/access.log json_logs;

    # Single-page app: send unknown routes to index.html. No $uri/ here:
    # /photos and /assignments are both app pages and folders in public/,
    # and the app page should win.
    location / {
        try_files $uri /index.html;
    }

    # The app's entry page: browsers must check for a new copy every time,
    # so a redeploy shows up right away. (Every page route ends up here.)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Hidden files and folders (/.env, /.git/config, ...) are never served.
    # Bots probe for these constantly; answer with a plain 404.
    location ~ /\. {
        return 404;
    }

    # ...but anything that looks like a file (/wp-login.php, /.env, a missing
    # image) gets a real 404 instead of the app's HTML, so probes and broken
    # links show up as 404s in the logs.
    location ~ \.[A-Za-z0-9]+$ {
        try_files $uri =404;
    }

    # Vite fingerprints everything in /assets, so it can be cached forever
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Download button: same files as /photos/, but forced to save as a file.
    # A separate path makes downloads countable in the access log, and
    # no-store keeps browsers from serving repeat downloads from cache.
    location ^~ /download/photos/ {
        alias /usr/share/nginx/html/photos/;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "no-store";
    }

    # Simple endpoint for cloud load balancer / container health checks
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
